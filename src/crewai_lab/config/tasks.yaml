research_task:
  description: >
    Conduct thorough research about {topic}. Identify key trends,
    breakthrough technologies, and notable insights.
  expected_output: >
    A list with 10 bullet points of the most relevant findings about {topic}.
  agent: researcher

reporting_task:
  description: >
    Review the findings from the research and expand each into a full section
    for a report, making sure the report is detailed and contains all
    relevant information.
  expected_output: >
    A fully fledged report with the main topics, formatted as markdown,
    without '```'.
  agent: reporting_analyst
  output_file: report.md
