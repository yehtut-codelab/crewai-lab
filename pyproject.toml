[project]
name = "crewai_lab"
version = "0.1.0"
description = "crewai_lab using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.98.0,<1.0.0",
]

[project.scripts]
crewai_lab = "crewai_lab.main:run"
train = "crewai_lab.main:train"
replay = "crewai_lab.main:replay"
test = "crewai_lab.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_lab"]
